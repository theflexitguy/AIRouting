services:
  # ---------------------------------------------------------------
  # OSRM — self-hosted routing engine (never goes down)
  # Arkansas road network for accurate drive times
  # ---------------------------------------------------------------
  osrm:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    ports:
      - "5050:5000"
    volumes:
      - ./osrm-data:/data
    entrypoint: >
      sh -c '
        if [ ! -f /data/arkansas-latest.osrm.cell_metrics ]; then
          echo "Processing road network data..."
          osrm-extract -p /opt/car.lua /data/arkansas-latest.osm.pbf &&
          osrm-partition /data/arkansas-latest.osrm &&
          osrm-customize /data/arkansas-latest.osrm &&
          echo "OSRM data ready."
        fi
        osrm-routed --algorithm mld /data/arkansas-latest.osrm --port 5000
      '
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Python routing backend (OGRouting engine + RouteIQ JSON bridge)
  # ---------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      FR_AUTH_ENABLED: "false"
      FR_LOG_LEVEL: "INFO"
      ROUTEIQ_ALLOWED_ORIGINS: "http://localhost:3000,https://*.vercel.app"
      # Google Maps — powers geocoding, Roads snap, and Routes drive times
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SNAP_TO_ROADS_ENABLED: "true"
      # FieldRoutes
      FIELDROUTES_BASE_URL: ${FIELDROUTES_BASE_URL:-https://api.fieldroutes.com}
      FIELDROUTES_AUTH_KEY: ${FIELDROUTES_AUTH_KEY:-}
      FIELDROUTES_SECRET_KEY: ${FIELDROUTES_SECRET_KEY:-}
      # OSRM — points to our self-hosted instance
      OSRM_BASE_URL: "http://osrm:5000"
      # Firebase — needed for AI learning (reading routeHistory, writing metrics)
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - osrm
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Next.js frontend
  # ---------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NEXT_PUBLIC_* must be baked in at build time
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: "http://backend:8000"
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
