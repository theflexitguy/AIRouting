services:
  # ---------------------------------------------------------------
  # Python routing backend (OGRouting engine + RouteIQ JSON bridge)
  # ---------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      FR_AUTH_ENABLED: "false"
      FR_LOG_LEVEL: "INFO"
      ROUTEIQ_ALLOWED_ORIGINS: "http://localhost:3000,https://*.vercel.app"
      # Google Maps — powers geocoding, Roads snap, and Routes drive times
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SNAP_TO_ROADS_ENABLED: "true"
      # FieldRoutes
      FIELDROUTES_BASE_URL: ${FIELDROUTES_BASE_URL:-https://api.fieldroutes.com}
      FIELDROUTES_AUTH_KEY: ${FIELDROUTES_AUTH_KEY:-}
      FIELDROUTES_SECRET_KEY: ${FIELDROUTES_SECRET_KEY:-}
      # OSRM — used for the optimization matrix (free, fast)
      # Override with self-hosted instance for production accuracy
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://router.project-osrm.org}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Next.js frontend
  # ---------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: "http://backend:8000"
      # Firebase
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      # Google Maps (frontend map display)
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
