services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      FR_DATA_ROOT: /data
      MATRIX_CACHE_DIR: /data/cache/osrm_matrix
      OSRM_BASE_URL: http://osrm:5000
      AUTO_START_ON_BOOT: "0"
      FIELDROUTES_CREATE_MISSING_APPOINTMENTS: "1"
      FIELDROUTES_DEFAULT_SERVICE_ID: "2"
    volumes:
      - ./data/app:/data
    depends_on:
      - osrm
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/region.osrm
    volumes:
      - ./data/osrm:/data:ro
    restart: unless-stopped

  reverse-proxy:
    image: caddy:2.10
    environment:
      INTERNAL_HOST: ${INTERNAL_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
